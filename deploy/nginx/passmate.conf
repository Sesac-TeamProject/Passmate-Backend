# 도메인 하나(EIP)로 웹과 API 를 함께 서비스한다. server_name 으로 가른다.
#   passmate.kr      → web 컨테이너 :3000  (Next.js)
#   api.passmate.kr  → app 컨테이너 :8080  (Spring Boot)
# 인증서는 호스트 certbot 이 발급·갱신하고, 이 컨테이너는 읽기만 한다.

# --- HTTP : ACME 챌린지만 열고 나머지는 https 로 보낸다 ---
server {
    listen 80;
    server_name passmate.kr api.passmate.kr;

    # certbot --webroot 갱신 경로. 리다이렉트보다 먼저 매칭돼야 한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 웹 : Next.js(Node) 프록시 ---
# 정적 파일 서빙이 아니다. 이 프론트는 정적 export 가 불가능하다 —
# next.config 의 redirects() 가 서버를 요구하고, /play/[code] 같은 동적 라우트는
# 방 코드를 미리 알 수 없어 generateStaticParams 로 뽑을 수 없다.
server {
    listen 443 ssl;
    http2 on;
    server_name passmate.kr;

    # certbot 이 -d passmate.kr 을 먼저 줬으므로 lineage 이름이 passmate.kr 이다
    ssl_certificate     /etc/letsencrypt/live/passmate.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passmate.kr/privkey.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 빌드 산출물. 파일명에 해시가 붙어 Next 가 이미 immutable 로 캐시를 지시하므로
    # 여기서 Cache-Control 을 덧붙이지 않는다 — add_header 는 덮어쓰기가 아니라
    # 추가라서 헤더가 두 줄로 나가고 해석이 모호해진다. 로그만 줄인다
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # RSC 스트리밍 응답이 버퍼에 갇히면 첫 바이트가 늦는다
        proxy_buffering off;
    }
}

# --- API : Spring Boot 프록시 ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.passmate.kr;

    ssl_certificate     /etc/letsencrypt/live/passmate.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passmate.kr/privkey.pem;

    # 앱의 multipart 상한(20MB)과 맞춘다. 여기가 작으면 nginx 가 413 으로 먼저 자른다
    client_max_body_size 20M;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 문항 생성이 동기 30초 SLA — 기본 60s 로 두면 아슬아슬하다
        proxy_read_timeout 90s;
    }

    # WebSocket(STOMP) — Upgrade 를 통과시키고 타임아웃을 길게 잡는다.
    # 세션은 수업 내내 열려 있어서 기본 60s 면 조용히 끊긴다
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
