# 도메인 하나(EIP)로 웹과 API 를 함께 서비스한다. server_name 으로 가른다.
#   passmate.kr      → /var/www/web 정적 파일
#   api.passmate.kr  → app 컨테이너 :8080
# 인증서는 호스트 certbot 이 발급·갱신하고, 이 컨테이너는 읽기만 한다.

# --- HTTP : ACME 챌린지만 열고 나머지는 https 로 보낸다 ---
server {
    listen 80;
    server_name passmate.kr api.passmate.kr;

    # certbot --webroot 갱신 경로. 리다이렉트보다 먼저 매칭돼야 한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 웹 : 정적 파일 ---
server {
    listen 443 ssl;
    http2 on;
    server_name passmate.kr;

    # certbot 이 -d passmate.kr 을 먼저 줬으므로 lineage 이름이 passmate.kr 이다
    ssl_certificate     /etc/letsencrypt/live/passmate.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passmate.kr/privkey.pem;

    root /var/www/web;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 웹 배포는 파일만 갈아끼우면 끝이고 nginx 재시작이 없다.
    # 그래서 "새 배포가 사용자에게 언제 닿느냐"를 사실상 캐시 정책이 결정한다.

    # 빌드 도구가 파일명에 해시를 붙인다(app.4f2a1c.js) — 내용이 바뀌면 이름도 바뀌므로
    # 오래 캐시해도 낡은 파일을 잡을 일이 없다
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp|avif|map)$ {
        # expires 지시어를 함께 쓰면 Cache-Control 이 두 줄로 나가 해석이 모호해진다 — 한 줄로만 보낸다
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 만은 캐시하지 않는다. 여기가 캐시되면 새 자산 파일을 가리키는
    # 진입점이 갱신되지 않아 배포해도 사용자 화면이 영영 그대로다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA — 새로고침·딥링크가 404 나지 않게 index.html 로 떨군다.
    # 웹이 SSR(Next·Nuxt)로 가면 이 블록 대신 Node 컨테이너로 proxy_pass 해야 한다
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API : Spring Boot 프록시 ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.passmate.kr;

    ssl_certificate     /etc/letsencrypt/live/passmate.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passmate.kr/privkey.pem;

    # 앱의 multipart 상한(20MB)과 맞춘다. 여기가 작으면 nginx 가 413 으로 먼저 자른다
    client_max_body_size 20M;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 문항 생성이 동기 30초 SLA — 기본 60s 로 두면 아슬아슬하다
        proxy_read_timeout 90s;
    }

    # WebSocket(STOMP) — Upgrade 를 통과시키고 타임아웃을 길게 잡는다.
    # 세션은 수업 내내 열려 있어서 기본 60s 면 조용히 끊긴다
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
