# 도메인 하나(EIP)로 웹과 API 를 함께 서비스한다. server_name 으로 가른다.
#   passmate.kr      → /var/www/web 정적 파일
#   api.passmate.kr  → app 컨테이너 :8080
# 인증서는 호스트 certbot 이 발급·갱신하고, 이 컨테이너는 읽기만 한다.

# --- HTTP : ACME 챌린지만 열고 나머지는 https 로 보낸다 ---
server {
    listen 80;
    server_name passmate.kr api.passmate.kr;

    # certbot --webroot 갱신 경로. 리다이렉트보다 먼저 매칭돼야 한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 웹 : 정적 파일 ---
server {
    listen 443 ssl;
    http2 on;
    server_name passmate.kr;

    # certbot 이 -d passmate.kr 을 먼저 줬으므로 lineage 이름이 passmate.kr 이다
    ssl_certificate     /etc/letsencrypt/live/passmate.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passmate.kr/privkey.pem;

    root /var/www/web;
    index index.html;

    # SPA — 새로고침·딥링크가 404 나지 않게 index.html 로 떨군다.
    # 웹이 SSR(Next·Nuxt)로 가면 이 블록 대신 Node 컨테이너로 proxy_pass 해야 한다
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API : Spring Boot 프록시 ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.passmate.kr;

    ssl_certificate     /etc/letsencrypt/live/passmate.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passmate.kr/privkey.pem;

    # 앱의 multipart 상한(20MB)과 맞춘다. 여기가 작으면 nginx 가 413 으로 먼저 자른다
    client_max_body_size 20M;

    # API 문서 — 웹·앱 팀 연동용. 그냥 열면 엔드포인트·요청 스키마가 전부 공개되므로
    # Basic Auth 로 가린다. 계정은 SSM 의 SWAGGER_HTPASSWD 에서 오고 deploy.sh 가 파일로 쓴다.
    # 정규식 location 이라 아래 `location /` 보다 먼저 매칭된다
    location ~ ^/(swagger-ui|v3/api-docs) {
        auth_basic           "PassMate API Docs";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 문항 생성이 동기 30초 SLA — 기본 60s 로 두면 아슬아슬하다
        proxy_read_timeout 90s;
    }

    # WebSocket(STOMP) — Upgrade 를 통과시키고 타임아웃을 길게 잡는다.
    # 세션은 수업 내내 열려 있어서 기본 60s 면 조용히 끊긴다
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
