# 운영 — EC2 한 대에 nginx · web · app · mysql 을 함께 올린다.
# RDS 를 쓰지 않는 결정은 노션 「인프라 구축 체크리스트 §비용」 참고(B안).
# Redis 는 후순위라 넣지 않는다(.claude/CLAUDE.md §Redis).
#
#   배포:  sudo /opt/passmate/deploy.sh
#   이미지 좌표·태그를 포함한 모든 값은 .env 에서 온다. deploy.sh 가 SSM Parameter Store 에서
#   만들어 두므로 레포에 커밋하지 않는다.
#
#   백엔드와 프론트는 레포가 달라 각자 배포한다. 서로를 되돌리지 않는 근거는
#   태그가 SSM 에 있다는 것이다 — 어느 쪽이 배포하든 상대의 현재 태그를 그대로 다시 읽어 쓴다.
name: passmate

# 컨테이너 로그 상한. json-file 기본값은 무제한이라 오래 돌면 디스크를 갉아먹는다.
# 컨테이너당 최대 20MB × 3개 = 60MB 에서 오래된 것부터 잘려 나간다
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: passmate-mysql
    restart: unless-stopped
    logging: *logging
    # ports 를 쓰지 않는다 — 호스트·인터넷에 3306 을 열지 않고 app 컨테이너에서만 붙는다
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # 2GB 인스턴스에 JVM 이 함께 산다 — 기본값(128M)보다 조금만 키우고 상한을 둔다
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    volumes:
      # named volume 이라 컨테이너를 지우고 다시 만들어도 데이터가 남는다
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    image: ${ECR_REPOSITORY}:${APP_IMAGE_TAG}
    container_name: passmate-app
    restart: unless-stopped
    logging: *logging
    depends_on:
      mysql:
        # Flyway 가 부팅 때 도는데 MySQL 이 아직이면 앱이 죽는다
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    expose:
      - "8080"
    healthcheck:
      # deploy.sh 가 이 상태를 보고 배포 성공/실패를 판정한다
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # 웹(Next.js) — 정적 export 가 불가능한 구조라(동적 라우트 · next.config 의 redirects)
  # Node 서버가 필요하다. nginx 가 passmate.kr 을 여기로 넘긴다.
  # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박히므로 이미지 자체가 환경을 담고 있다 —
  # 여기서 API 주소를 바꿔도 소용없고, 프론트 CI 의 build-arg 를 바꿔야 한다.
  web:
    image: ${ECR_WEB_REPOSITORY}:${WEB_IMAGE_TAG}
    container_name: passmate-web
    restart: unless-stopped
    logging: *logging
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # 2GB 인스턴스에 JVM(640m)·MySQL(256m 풀)이 함께 산다 — JS 힙 상한을 못 박는다
      NODE_OPTIONS: --max-old-space-size=320
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: passmate-nginx
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/passmate.conf:/etc/nginx/conf.d/default.conf:ro
      # 인증서는 호스트 certbot 이 관리한다. 컨테이너는 읽기만 한다
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot --webroot 갱신용 챌린지 경로
      - /var/www/certbot:/var/www/certbot:ro

volumes:
  mysql-data:
