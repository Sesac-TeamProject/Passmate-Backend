# 운영 — EC2 한 대에 nginx · app · mysql 을 함께 올린다.
# RDS 를 쓰지 않는 결정은 노션 「인프라 구축 체크리스트 §비용」 참고(B안).
# Redis 는 후순위라 넣지 않는다(.claude/CLAUDE.md §Redis).
#
#   배포:  sudo /opt/passmate/deploy.sh <ECR_REPOSITORY> <IMAGE_TAG>
#   .env 는 deploy.sh 가 SSM Parameter Store 에서 만들어 둔다 — 레포에 커밋하지 않는다.
name: passmate

services:
  mysql:
    image: mysql:8.0
    container_name: passmate-mysql
    restart: unless-stopped
    # ports 를 쓰지 않는다 — 호스트·인터넷에 3306 을 열지 않고 app 컨테이너에서만 붙는다
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # 2GB 인스턴스에 JVM 이 함께 산다 — 기본값(128M)보다 조금만 키우고 상한을 둔다
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    volumes:
      # named volume 이라 컨테이너를 지우고 다시 만들어도 데이터가 남는다
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG}
    container_name: passmate-app
    restart: unless-stopped
    depends_on:
      mysql:
        # Flyway 가 부팅 때 도는데 MySQL 이 아직이면 앱이 죽는다
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    expose:
      - "8080"
    healthcheck:
      # deploy.sh 가 이 상태를 보고 배포 성공/실패를 판정한다
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    container_name: passmate-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/passmate.conf:/etc/nginx/conf.d/default.conf:ro
      # Swagger Basic Auth 계정. deploy.sh 가 SSM 값으로 매 배포마다 새로 쓴다.
      # ⚠️ 파일이 없으면 Docker 가 같은 이름의 디렉터리를 만들어 nginx 가 못 뜬다 —
      #    그래서 deploy.sh 는 값이 비어 있어도 빈 파일을 반드시 만든다
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # 인증서는 호스트 certbot 이 관리한다. 컨테이너는 읽기만 한다
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 웹 팀이 올린 정적 파일
      - /var/www/web:/var/www/web:ro
      # certbot --webroot 갱신용 챌린지 경로
      - /var/www/certbot:/var/www/certbot:ro

volumes:
  mysql-data:
