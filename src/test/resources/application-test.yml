# 통합 테스트 — 데이터소스는 IntegrationTestSupport 의 @DynamicPropertySource 가 주입한다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    clean-disabled: false

logging:
  level:
    kr.passmate: DEBUG
    org.testcontainers: INFO
    org.hibernate.SQL: INFO

passmate:
  # 테스트에서 실제 OpenAI 를 부르는 일이 없도록 키를 비워 둔다. Client 는 Fake 로 대체한다
  ai:
    api-key: ""
  encryption:
    key: test-encryption-key-for-integration-tests-32bytes
  jwt:
    secret: test-secret-key-for-integration-tests-at-least-32-bytes
  # 값이 있어야 결제 경로가 열린다. 실제 포트원 호출은 FakePortOneClient 가 대신한다
  portone:
    store-id: store-test
    channel-key: channel-key-test
    api-secret: test-api-secret
    # Standard Webhooks 규격: whsec_ 뒤가 base64 키다. 아무 문자열이나 넣으면 디코딩에서 막힌다
    webhook-secret: whsec_dGVzdC13ZWJob29rLXNlY3JldC1rZXk=
  storage:
    bucket: passmate-test
