# 통합 테스트 — 데이터소스는 Testcontainers @ServiceConnection 이 주입한다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    clean-disabled: false

logging:
  level:
    kr.passmate: DEBUG
    org.testcontainers: INFO
    org.hibernate.SQL: INFO

passmate:
  jwt:
    secret: test-secret-key-for-integration-tests-at-least-32-bytes
  storage:
    bucket: passmate-test
