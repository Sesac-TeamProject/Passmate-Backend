# 운영 — AWS RDS(MySQL 8). 시크릿은 SSM Parameter Store → 환경변수로 주입한다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:passmate}?characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

logging:
  level:
    root: INFO
    kr.passmate: INFO

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
