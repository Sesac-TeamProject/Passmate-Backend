# 로컬 — docker-compose.local.yml 의 MySQL 8 을 바라본다.
spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/passmate?characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true
    username: passmate
    password: passmate
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    kr.passmate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

passmate:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-please-change-this-to-at-least-32-bytes}
  storage:
    bucket: ${S3_BUCKET:passmate-local}
