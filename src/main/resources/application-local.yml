# 로컬 — docker/compose.local.yml 의 MySQL 8(호스트 3307) 을 바라본다.
spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/passmate?characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true
    username: passmate
    password: passmate
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    kr.passmate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

passmate:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-please-change-this-to-at-least-32-bytes}
  storage:
    bucket: ${S3_BUCKET:passmate-local}
  cors:
    # 로컬은 프런트 개발 서버 포트가 유동적이라(Vite 5173 · Next 3000 …) 와일드카드로 연다
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
