spring:
  application:
    name: passmate
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway만 — update/create 금지
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      # 요청 디코딩만 강제한다. 응답까지 강제하면 PNG 같은 바이너리에도
      # charset=UTF-8 이 붙어 Content-Type 이 틀어진다
      force-request: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

# 정책값 — 하드코딩 금지, 전부 여기서 주입 (PolicyProperties)
passmate:
  policy:
    entry-fee-min: 100                 # 참가비 하한 (코인, 1 C = 1원)
    entry-fee-max: 10000               # 참가비 상한
    charge-amount-min: 1000            # 코인 충전 1회 하한
    charge-amount-max: 1000000         # 코인 충전 1회 상한 (오입력·악용 방지)
    settlement-min-amount: 10000       # 최소 정산액 (원)
    ai-free-limit: 5                   # AI 문항 생성 무료 횟수 (호스트, 누적 — 명세 "최초 5회 무료")
    essay-analysis-free-limit: 5       # 월 서술형 AI 분석 무료 횟수 (학생, FR-075)
    essay-analysis-coin-cost: 100      # 무료 한도 초과 시 분석 1건당 차감 코인 (1 C = 1원)
    rating-window-hours: 24            # 종료 후 평가 가능 시간
    host-earning-rate: 0.8             # 호스트 수익 배분율 (80:20)
    guest-retention-days: 7            # 게스트 기록 보관 일수
  # 호스트 등급표 (기능 명세서 §7.1 FR-045). 기준은 운영하며 조정되므로 코드에 박지 않는다
  host-level:
    rating-sample-min: 5             # 별점 조건 판정에 필요한 최소 평가 수 (FR-046)
    maintenance-days: 30             # Lv.4~5 유지 판정 주기(일) (FR-047)
    levels:
      - level: 1
        name: 새싹
        rooms-hosted: 1
        total-students: 0
        unlock: 프로필 뱃지
      - level: 2
        name: 성장
        rooms-hosted: 10
        total-students: 50
      - level: 3
        name: 검증된 운영자
        rooms-hosted: 20
        total-students: 150
        min-avg-rating: 4.0
        unlock: 유료 방 개설
      - level: 4
        name: 인기 운영자
        rooms-hosted: 40
        total-students: 400
        maintain-sessions: 4
        maintain-avg-rating: 4.0
        unlock: 방 목록 상단 노출
      - level: 5
        name: 마스터
        rooms-hosted: 100
        total-students: 1000
        maintain-sessions: 5
        maintain-avg-rating: 4.0
        unlock: 브랜디드 퀴즈 제안
  # 정산 계좌번호처럼 다시 읽어야 하지만 평문으로 두면 안 되는 값에 쓴다.
  # 비어 있으면 그 경로를 막는다 — 설정이 빠진 채 평문으로 쌓이면 되돌릴 수 없다
  encryption:
    key: ${ENCRYPTION_KEY:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 3600         # 1시간
    refresh-token-validity-seconds: 1209600     # 14일
  storage:
    # 자격증명은 여기 없다 — 운영은 EC2 인스턴스 역할, 로컬은 AWS SDK 기본 체인이 찾는다
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-minutes: ${S3_PRESIGNED_MINUTES:30}
    max-upload-mb: ${S3_MAX_UPLOAD_MB:10}
  ai:
    # 제공자는 OpenAI (2026-08-31 결정). 모델은 env 로만 주입하고 코드에 박지 않는다
    provider: openai
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    # ⚠️ 지금 값은 "연동·출력 확인용 잠정값"이다. 운영 전에 다시 정한다.
    # gpt-4(원조)·gpt-4-turbo 는 Structured Outputs(json_schema strict)를 지원하지 않아
    # 우리가 실제로 쓸 경로를 검증하지 못한다. 4 계열 중에서는 gpt-4o-mini 부터 지원한다.
    # 문제 생성 — 동기 30초 SLA, Structured Outputs 로 형식을 강제한다
    generation-model: ${LLM_GENERATION_MODEL:gpt-4o-mini}
    # 서술형 분석 — 문항 × 참가자 수만큼 불리므로 가장 싼 축으로 둔다
    analysis-model: ${LLM_ANALYSIS_MODEL:gpt-4o-mini}
    # 추론 강도. 문제 생성은 30초 안에 끝나야 해서 낮게 둔다
    reasoning-effort: ${LLM_REASONING_EFFORT:}   # 추론 모델(gpt-5 계열)에서만 유효 — 비우면 파라미터를 보내지 않는다
    timeout-seconds: 30
    max-concurrent-analysis: 4
  # 포트원 V2. 테스트 채널과 실연동 채널은 값만 다르고 코드는 같다
  # (2026-09-03 결정: 운영도 테스트 채널을 쓴다 — 실결제가 없어 PG 실계약이 필요 없다)
  portone:
    base-url: ${PORTONE_BASE_URL:https://api.portone.io}
    # 결제창을 띄우는 값 — 클라이언트에 내려보내도 된다
    store-id: ${PORTONE_STORE_ID:}
    channel-key: ${PORTONE_CHANNEL_KEY:}
    # 서버 전용 — 결제 조회·취소까지 되는 열쇠라 응답에 절대 싣지 않는다
    api-secret: ${PORTONE_API_SECRET:}
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
    timeout-seconds: ${PORTONE_TIMEOUT_SECONDS:10}
  client:
    base-url: ${WEB_BASE_URL:http://localhost:5173}
  cors:
    # 브라우저(웹)만 해당된다 — 네이티브 앱은 CORS 대상이 아니다.
    # 기본값은 웹 배포 주소(WEB_BASE_URL) 하나. 도메인이 바뀌면 SSM 값만 갈아끼우면 되고
    # 코드 수정·재빌드가 필요 없다. 출처를 더 열어야 하면 CORS_ALLOWED_ORIGINS 로 덮어쓴다(쉼표 구분)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${WEB_BASE_URL:http://localhost:5173}}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    token-uri: https://oauth2.googleapis.com/token
    issuers: https://accounts.google.com,accounts.google.com
