spring:
  application:
    name: passmate
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway만 — update/create 금지
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

# 정책값 — 하드코딩 금지, 전부 여기서 주입 (PolicyProperties)
passmate:
  policy:
    entry-fee-min: 100                 # 참가비 하한 (코인, 1 C = 1원)
    entry-fee-max: 10000               # 참가비 상한
    settlement-min-amount: 10000       # 최소 정산액 (원)
    ai-free-limit: 3                   # 월 AI 세트 생성 무료 횟수
    rating-window-hours: 24            # 종료 후 평가 가능 시간
    host-earning-rate: 0.8             # 호스트 수익 배분율 (80:20)
    guest-retention-days: 7            # 게스트 기록 보관 일수
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 3600         # 1시간
    refresh-token-validity-seconds: 1209600     # 14일
  storage:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
  ai:
    model: ${LLM_MODEL:claude-opus-5}
    api-key: ${ANTHROPIC_API_KEY:}
    timeout-seconds: 30
    max-concurrent-analysis: 4
  portone:
    api-secret: ${PORTONE_API_SECRET:}
    store-id: ${PORTONE_STORE_ID:}
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    token-uri: https://oauth2.googleapis.com/token
    issuers: https://accounts.google.com,accounts.google.com
